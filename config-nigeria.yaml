# ============================================================
# NIGERIA NEWS — Politics, economy, security, sports, tech
# Run: python main.py run-all --config config-nigeria.yaml -v --no-approve-prompt --no-download-prompt
# ============================================================

general:
  language: en
  timezone: Africa/Lagos
  user_agent: "NewsHighlightsPersonal/1.0 (personal, non-commercial use)"
  request_delay_seconds: 2.0
  request_timeout: 20
  data_dir: data-nigeria
  max_claude_calls_per_run: 20

claude:
  model: claude-haiku-5-5
  max_tokens: 4000
  temperature: 0.3

# ---- Feeds (tested reachable = enabled: true) --------------------------------
outlets:
  - name: Punch
    rss_url: https://punchng.com/feed/
    enabled: true

  - name: Premium Times
    rss_url: https://www.premiumtimesng.com/feed/
    enabled: true

  - name: BBC Africa
    rss_url: https://feeds.bbci.co.uk/news/world/africa/rss.xml
    enabled: true

  - name: BBC Pidgin
    rss_url: https://feeds.bbci.co.uk/pidgin/rss.xml
    enabled: true

  # Proxy-blocked outlets — set enabled: true if your network allows them
  - name: Vanguard
    rss_url: https://www.vanguardngr.com/feed/
    enabled: false

  - name: The Cable
    rss_url: https://www.thecable.ng/feed/
    enabled: false

  - name: Channels TV
    rss_url: https://www.channelstv.com/feed/
    enabled: false

  - name: The Nation
    rss_url: https://thenationonlineng.net/feed/
    enabled: false

  - name: Guardian Nigeria
    rss_url: https://guardian.ng/feed/
    enabled: false

  - name: ThisDay
    rss_url: https://www.thisdaylive.com/feed/
    enabled: false

  - name: Daily Trust
    rss_url: https://dailytrust.com/feed/
    enabled: false

  - name: Leadership
    rss_url: https://leadership.ng/feed/
    enabled: false

  - name: BusinessDay
    rss_url: https://businessday.ng/feed/
    enabled: false

  - name: Nairametrics
    rss_url: https://nairametrics.com/feed/
    enabled: false

  - name: Sahara Reporters
    rss_url: https://saharareporters.com/rss.xml
    enabled: false

  - name: TechCabal
    rss_url: https://techcabal.com/feed/
    enabled: false

  - name: TechPoint Africa
    rss_url: https://techpoint.africa/feed/
    enabled: false

news_apis:
  - provider: gnews
    enabled: false
  - provider: newsdata
    enabled: false

collector:
  max_stories_per_outlet: 20
  min_article_chars: 600
  fetch_full_text: true
  respect_robots: true
  lookback_hours: 24

selection:
  top_n: 5
  max_per_outlet: 4
  prefer_full_text: true
  keywords_exclude: []

  keywords_include:
