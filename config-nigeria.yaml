images:
  image_mode: auto
  auto_order: [article, stock, cards]
  images_per_story: 2
  min_width: 500
  min_height: 300
  monetization_safe: false

people:
  enabled: true
  max_per_story: 2
  require_approval: false
  auto_use_min_confidence: 0.85
  manual_photos_dir: people_photos
  wikipedia_lang: en
  search_api:
    enabled: false

script:
  words_per_story: 90
  intro_words: 30
  outro_words: 25
  tone: "authoritative, clear-voiced Nigerian news presenter"

tts:
  providers: [edge-tts]
  speed: 1.0
  pitch_hz: 0
  sentence_pause_ms: 280
  edge_tts:
    voice: en-NG-AbeoNeural        # Nigerian male voice

video:
  aspect: landscape
  height: 720
  fps: 25
  image_transition_seconds: 0.6
  segment_pad_seconds: 0.5
  zoom_amount: 0.12
  crf: 20
  preset: veryfast
  brand:
    name: Nigeria Daily
    primary_color: "#008751"       # Nigeria green
    accent_color: "#FFFFFF"
    text_color: "#FFFFFF"
    intro_title: "Nigeria Daily"
    outro_text: "Stay Informed"

export:
  target_mb: 15.0
  audio_kbps: 96
  min_video_kbps: 350
  max_video_kbps: 2500
  preset: medium

download:
  download_dir: ""
