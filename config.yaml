# News Highlights - settings. Every key is optional; anything you leave out uses the built-in default.
# Secrets (API keys) do NOT go here. Put them in the .env file.

general:
  language: en                  # language of the script and the voice (en, fr, ha, yo, ig ...)
  timezone: Africa/Lagos        # decides what "today" means
  user_agent: "NewsHighlightsPersonal/1.0 (personal, non-commercial use; contact: you@example.com)"
  request_delay_seconds: 2.0    # pause between web requests (be polite to the outlets)
  request_timeout: 20
  data_dir: data
  max_claude_calls_per_run: 20  # safety cap on paid AI calls per run

claude:
  model: claude-haiku-5-5  # cheap and fast; switch to a bigger model for better scripts
  max_tokens: 4000
  temperature: 0.3

# ---- Where the news comes from -------------------------------------------------------------
# RSS addresses change now and then: open each one in your browser to check it still works.
# Some outlets only publish headlines + a snippet in RSS; those stories are marked "summary_only".
outlets:
  - name: BBC News Africa
    rss_url: https://feeds.bbci.co.uk/news/world/africa/rss.xml
    enabled: true
  - name: Punch
    rss_url: https://punchng.com/feed/
    enabled: true
  - name: Premium Times
    rss_url: https://www.premiumtimesng.com/feed
    enabled: true
  - name: Vanguard
    rss_url: https://www.vanguardngr.com/feed/
    enabled: false
  - name: Channels TV
    rss_url: https://www.channelstv.com/feed/
    enabled: false

# Optional: headline APIs (need a free key in .env). Set enabled: true to use one.
news_apis:
  - provider: gnews             # key: GNEWS_API_KEY
    enabled: false
    params: {country: ng, lang: en}
  - provider: newsdata          # key: NEWSDATA_API_KEY
    enabled: false
    params: {country: ng, language: en}

collector:
  max_stories_per_outlet: 5
  min_article_chars: 600        # shorter text is treated as "summary only"
  fetch_full_text: true
  respect_robots: true
  lookback_hours: 48            # only stories from the last N hours are considered

selection:
  top_n: 5                      # stories per video
  max_per_outlet: 2
  keywords_include: []          # e.g. [Lagos, economy]  (empty = everything)
  keywords_exclude: []          # e.g. [celebrity, gossip]
  prefer_full_text: true

# ---- Pictures -------------------------------------------------------------------------------
images:
  image_mode: auto              # article | stock | ai | cards | auto
  auto_order: [article, stock, cards]
  images_per_story: 2
  min_width: 500
  min_height: 300
  monetization_safe: false      # true = never use outlet photos; only stock / AI / cards, and
                                # only person photos with licences that allow commercial use
  pexels_api_key_env: PEXELS_API_KEY
  pixabay_api_key_env: PIXABAY_API_KEY
  ai_provider: ""               # placeholder; pick a provider later

people:                         # photos of PUBLIC figures named in the stories (no face recognition)
  enabled: true
  max_per_story: 2
  require_approval: true        # true = a photo is only used after you approve it
  auto_use_min_confidence: 0.85 # used only when require_approval is false
  manual_photos_dir: people_photos   # your own photos named "Firstname Lastname.jpg" (inside data/)
  manual_commercial_ok: false
  wikipedia_lang: en
  search_api:                   # optional Google Programmable Search; licence unknown, always needs approval
    enabled: false
    key_env: GOOGLE_CSE_KEY
    cx_env: GOOGLE_CSE_CX

# ---- Script -----------------------------------------------------------------------------------
script:
  words_per_story: 90           # about 35-45 seconds spoken
  intro_words: 30
  outro_words: 25
  tone: "neutral, clear, conversational news-reader"

# ---- Voice ------------------------------------------------------------------------------------
tts:
  providers: [edge-tts]         # tried in this order; the first that works is used
  speed: 1.0                    # 0.9 = slower, 1.1 = faster
  pitch_hz: 0                   # edge-tts only, e.g. -10 for deeper
  sentence_pause_ms: 280
  edge_tts:
    voice: en-NG-EzinneNeural   # female Nigerian English; en-NG-AbeoNeural = male
  kokoro:
    voice: af_heart
    lang_code: a
  piper:
    binary: piper
    model_path: ""              # path to a downloaded .onnx voice
  elevenlabs:
    voice_id: ""
    model_id: eleven_multilingual_v2
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  own_voice:
    sample_dir: voice_samples   # put a clean 10-30 s recording of YOUR voice here (inside data/)
    language: en
    model_dir: models/xtts_v2   # a downloaded XTTS folder here is used instead of the Hugging Face hub
  pronunciations: {}            # words the voice gets wrong, e.g.  {"Ikorodu": "Ee-ko-ro-doo", "NNPC": "N N P C"}

# ---- Video ------------------------------------------------------------------------------------
video:
  aspect: landscape             # landscape (16:9) or portrait (9:16, good for phones/Status)
  height: 720                   # short side in pixels
  fps: 25
  image_transition_seconds: 0.6
  segment_pad_seconds: 0.5
  zoom_amount: 0.12
  crf: 20
  preset: veryfast
  music_dir: music              # optional: drop an mp3 you have the rights to in data/music/
  music_volume: 0.07
  brand:
    name: News Highlights
    primary_color: "#0B3D91"
    accent_color: "#F2A900"
    text_color: "#FFFFFF"
    font_path: ""               # e.g. C:/Windows/Fonts/arialbd.ttf (empty = automatic)
    logo_path: ""               # a PNG with transparency (optional)
    intro_title: "Today's News Highlights"
    outro_text: "Thanks for watching"

export:
  target_mb: 15.0               # WhatsApp's video limit is about 16 MB
  audio_kbps: 96
  min_video_kbps: 350           # below this the video is split into parts instead
  max_video_kbps: 2500
  preset: medium

download:
  download_dir: ""              # empty = your system Downloads folder
